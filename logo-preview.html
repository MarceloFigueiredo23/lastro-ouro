<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lastro Ouro — Logo v7</title>
  <style>
    body { margin: 0; background: #0A0A0A; color: #F7F1E6; font-family: Georgia, serif; }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 88px; padding: 0 1.5rem; border-bottom: 1px solid rgba(212,175,55,0.22);
    }
    .nav img { height: 72px; width: auto; max-width: 380px; object-fit: contain; }
    .mid { padding: 2rem 1.25rem; max-width: 720px; margin: 0 auto; }
    .mid .box { max-width: 300px; margin: 1rem auto; background: #0A0A0A; border: 1px solid rgba(212,175,55,0.35); border-radius: 16px; padding: 0.65rem; }
    .mid img { width: 100%; height: auto; display: block; border-radius: 8px; }
    h1 { color: #D4AF37; font-size: 1.1rem; margin: 0 0 0.5rem; }
    p { color: #A89F94; font-size: 0.95rem; }
    .label { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37; }
  </style>
</head>
<body>
  <div class="nav">
    <img src="assets/logo.png?v=5" alt="Lastro Ouro menu" />
    <span style="color:#D4AF37;font-size:0.85rem;">Menu (logo maior)</span>
  </div>
  <div class="mid">
    <div class="label">Meio da página</div>
    <h1>Logo menor e centralizada</h1>
    <p>Binóculos no tamanho das letras · lockup centralizado. Ctrl+F5 se cachear.</p>
    <div class="box">
      <img src="assets/logo.png?v=5" alt="Lastro Ouro" />
    </div>
  </div>
</body>
</html>
