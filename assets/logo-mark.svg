<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none" role="img" aria-label="Lastro Ouro">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8892D"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F5D5BB"/>
      <stop offset="100%" stop-color="#C99570"/>
    </linearGradient>
    <linearGradient id="lens" x1="0.2" y1="0.1" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2C3842"/>
      <stop offset="100%" stop-color="#0A0E12"/>
    </linearGradient>
  </defs>

  <rect width="220" height="260" rx="28" fill="#0A0A0A"/>

  <!-- cartola -->
  <rect x="76" y="12" width="68" height="52" rx="5" fill="#111"/>
  <ellipse cx="110" cy="14" rx="34" ry="8" fill="#1C1C1C"/>
  <rect x="76" y="56" width="68" height="11" fill="url(#g)"/>
  <ellipse cx="110" cy="70" rx="56" ry="10" fill="#0E0E0E"/>
  <ellipse cx="110" cy="68" rx="50" ry="5" fill="url(#g)" opacity="0.9"/>

  <!-- smoking -->
  <path d="M30 230 C50 185, 75 170, 110 170 C145 170, 170 185, 190 230 L190 250 L30 250 Z" fill="#101010"/>
  <path d="M85 178 L110 220 L135 178" fill="#080808"/>
  <path d="M96 180 L110 208 L124 180" fill="#F4EEE4"/>
  <path d="M92 195 L110 185 L128 195 L110 205 Z" fill="url(#g)"/>

  <!-- rosto -->
  <ellipse cx="110" cy="130" rx="46" ry="48" fill="url(#skin)"/>

  <!-- mãos -->
  <ellipse cx="32" cy="140" rx="18" ry="13" fill="url(#skin)" transform="rotate(-25 32 140)"/>
  <ellipse cx="188" cy="140" rx="18" ry="13" fill="url(#skin)" transform="rotate(25 188 140)"/>

  <!-- binóculos -->
  <circle cx="78" cy="128" r="32" fill="#0E0E0E" stroke="url(#g)" stroke-width="7"/>
  <circle cx="78" cy="128" r="20" fill="url(#lens)" stroke="#F0D78C" stroke-width="2"/>
  <rect x="100" y="118" width="20" height="18" rx="4" fill="url(#g)"/>
  <circle cx="142" cy="128" r="32" fill="#0E0E0E" stroke="url(#g)" stroke-width="7"/>
  <circle cx="142" cy="128" r="20" fill="url(#lens)" stroke="#F0D78C" stroke-width="2"/>

  <!-- bigode -->
  <path d="M68 160 C82 145, 96 148, 110 154 C124 148, 138 145, 152 160 C138 172, 124 178, 110 172 C96 178, 82 172, 68 160 Z" fill="#2A1C14"/>
  <path d="M92 185 Q110 196 128 185" stroke="#6B4530" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
